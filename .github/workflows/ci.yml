name: CI

# Nightly on main, never on PRs or merges (decided 2026-09-28). The pipeline reads the
# result at pick-up (~/.claude/skills/continue-plan/nightly-ci.sh);
# `gh workflow run ci.yml --ref <branch>` tests a branch by hand.
on:
  schedule:
    - cron: '0 10 * * *'   # 10:00 UTC
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Skip a scheduled run when main has not moved since the last one ──
  # The job name is read by nightly-ci.sh, which passes over runs where this
  # is the only job that ran. Keep it exactly as written.
  changes:
    name: New commits since last nightly
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        # A manual dispatch always tests; a scheduled run only when main moved in ~25h.
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$GITHUB_EVENT_NAME" != schedule ] || [ "$age" -lt 90000 ]; then
            echo run=true >> "$GITHUB_OUTPUT"
          else
            echo run=false >> "$GITHUB_OUTPUT"
          fi

  # ── Gate job: cheapest runner, fails fast ──────────────────────────
  test-linux:
    name: Linux x86_64 (gate)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install LLVM
        run: sudo apt-get update && sudo apt-get install -y llvm-17 llvm-17-dev

      - name: Build
        run: ./run-build.sh

      - name: Run all tests
        run: ./run-tests.sh

  # ── Fan-out: all expensive jobs run in parallel after gate passes ──

  test-unix:
    name: ${{ matrix.name }}
    needs: test-linux
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (full suite)
            runner: macos-26
            llvm_install: brew install llvm@17
          - name: Linux ARM64 (full suite)
            runner: ubuntu-26.04-arm
            llvm_install: sudo apt-get update && sudo apt-get install -y llvm-17 llvm-17-dev
    steps:
      - uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Install LLVM
        run: ${{ matrix.llvm_install }}

      - name: Build
        run: ./run-build.sh

      - name: Run all tests
        run: ./run-tests.sh

  test-windows:
    name: Windows (full suite)
    needs: test-linux
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Set up Python (for selfhost AST normalization)
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v6
        with:
          path: C:/llvm
          key: llvm-18.1.8-windows-amd64-msvc17

      - name: Install LLVM (vovkos pre-built with dev headers)
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          curl -L -o llvm.7z "https://github.com/vovkos/llvm-package-windows/releases/download/llvm-18.1.8/llvm-18.1.8-windows-amd64-msvc17-msvcrt.7z"
          7z x llvm.7z -oC:/llvm -y

      - name: Configure LLVM paths
        run: |
          echo "LLVM_PREFIX=C:/llvm/llvm-18.1.8-windows-amd64-msvc17-msvcrt" >> $GITHUB_ENV
          echo "C:/llvm/llvm-18.1.8-windows-amd64-msvc17-msvcrt/bin" >> $GITHUB_PATH

      - name: Build
        run: ./run-build.sh

      - name: Run all tests
        run: ./run-tests.sh

  cross-compile-windows-arm64:
    name: Windows ARM64 (cross-compile check)
    needs: test-linux
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Cross-compile for Windows ARM64 (no LLVM)
        run: zig build -Dtarget=aarch64-windows

      - name: Verify binary was produced
        run: |
          test -f zig-out/bin/klar.exe
          file zig-out/bin/klar.exe
